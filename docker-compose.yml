# ==============================================================================
# Synology DS718+ (2GB RAM + Tailscale) 容器部署：Homepage
# 避開現有服務埠號：novel(3000)、uptime-kuma(3001)、LibreTV(8080)、nginx(8088/8443)、vaultwarden(8200)
# 適用介面：Synology Container Manager「專案 (Project)」或 docker compose CLI
# ==============================================================================

services:
  homepage:
    image: ${HOMEPAGE_IMAGE:-ghcr.io/gethomepage/homepage:latest}
    container_name: homepage
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 256m
    cpu_shares: 512
    ports:
      - "${HOMEPAGE_BIND_IP:-0.0.0.0}:${HOMEPAGE_PORT:-3010}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - NODE_OPTIONS=--max-old-space-size=128
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-localhost:3010,127.0.0.1:3010}
      - HOMEPAGE_VAR_NAS_HOST=${HOMEPAGE_VAR_NAS_HOST:-192.168.1.100}
      - HOMEPAGE_VAR_DSM_PORT=${HOMEPAGE_VAR_DSM_PORT:-5001}
      - HOMEPAGE_VAR_LIBRETV_URL=${HOMEPAGE_VAR_LIBRETV_URL:-http://192.168.1.100:8080}
      - HOMEPAGE_VAR_NOVEL_URL=${HOMEPAGE_VAR_NOVEL_URL:-http://192.168.1.100:3000}
      - HOMEPAGE_VAR_VAULTWARDEN_URL=${HOMEPAGE_VAR_VAULTWARDEN_URL:-http://192.168.1.100:8200}
      - HOMEPAGE_VAR_UPTIME_KUMA_URL=${HOMEPAGE_VAR_UPTIME_KUMA_URL:-http://192.168.1.100:3001}
    volumes:
      - ./config:/app/config
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "-Y", "off", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 25s
